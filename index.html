<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>

    <link rel="stylesheet" href="index.css">

    <title>steam game roulette</title>
</head>
<body>
<div class="main">
    <div class="spinner">

        <h1>steam gamebler (not gaben approved (yet))</h1>
        <h1 class="chosen-game" id="game-slot">{ ^ press the wheel ^ }</h1>


        <div class="game-info">
            <h5 class="game-data" id="game-time">total playtime: { how would i know } minutes</h5>
            <h5 class="game-data" id="game-lastplayed">last played: { did/you/enter/your/userID }</h5>
            <h5 class="game-data" id="game-link">link: { just.press.the.wheel }</h5>
        </div>
    </div>

    <div class="bottom-area">
        <input type="text" class="user-text" id="user-id" placeholder="Steam ID (vanity or ID64)">
        <button type="submit" class="sub-button" id="user-submit">Submit</button>
    </div>
</div>
</body>
<script src="index.js"></script>
</html>
